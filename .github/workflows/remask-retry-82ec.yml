name: ReMask retry job 82ec
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/remask-retry-82ec.yml

jobs:
  retry:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Retry failed ReMask job and wait for terminal status
        env:
          BASE: https://remask-production-c246.up.railway.app
          JOB: 82ec8eeb133840629529129b094eb136
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 20 \
            -X POST "$BASE/api/v1/jobs/$JOB/retry-failed" \
            -H 'Content-Type: application/json' -d '{}'
          echo
          for i in $(seq 1 150); do
            BODY="$(curl --fail --silent --show-error --max-time 20 "$BASE/api/v1/jobs/$JOB")"
            SUMMARY="$(BODY="$BODY" python3 -c "import json,os; j=json.loads(os.environ['BODY']); items=j.get('items') or []; item=items[0] if items else {}; print(json.dumps({'status':j.get('status'),'item_status':item.get('status'),'error_code':item.get('error_code'),'error_message':item.get('error_message')},ensure_ascii=False))")"
            echo "$SUMMARY"
            STATUS="$(SUMMARY="$SUMMARY" python3 -c "import json,os; print(json.loads(os.environ['SUMMARY']).get('status') or '')")"
            case "$STATUS" in
              SUCCESS|FAILED|PARTIAL) exit 0 ;;
            esac
            sleep 2
          done
          exit 1
