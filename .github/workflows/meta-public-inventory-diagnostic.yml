name: Inspect observed public Meta Relay modules
on:
  push:
    branches: [fix/meta-rk-discovery-diagnostic]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install tree-sitter==0.25.2 tree-sitter-javascript==0.25.0
      - name: Analyze public JS from failed job without profile credentials
        run: PYTHONPATH=python_backend python scripts/inspect-public-relay-inventory.py
