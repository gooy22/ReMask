name: Build ReMask recovery image

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - docker-start.sh
      - python_backend/**
      - railway-*.php
      - railway-*.js
      - remask-preview-runtime.tar.gz
      - .deploy/**
      - .github/workflows/remask-recovery-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/gooy22/remask:recovery
            ghcr.io/gooy22/remask:${{ github.sha }}
          provenance: false
