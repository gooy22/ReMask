name: ReMask publish verified canary image

on:
  push:
    branches:
      - fix/gated-fast-inventory-sync-20261019
    paths:
      - ".github/workflows/remask-publish-canary.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: remask-canary-pr199-publish
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact tested source
        uses: actions/checkout@v4

      - name: Build Dockerfile and run its regression tests
        run: docker build --progress=plain --tag remask-canary-checked .

      - name: Log into GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag and publish immutable commit-tagged image
        id: publish
        env:
          TAG: ghcr.io/gooy22/remask:canary-pr199-${{ github.sha }}
        run: |
          set -euo pipefail
          docker tag remask-canary-checked "$TAG"
          docker push "$TAG"
          docker buildx imagetools inspect "$TAG"
          echo "image=$TAG" >> "$GITHUB_OUTPUT"
