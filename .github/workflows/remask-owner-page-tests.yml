name: ReMask owner Page access tests

on:
  push:
    paths:
      - "python_backend/app/provisioning/page_access_handler.py"
      - "python_backend/tests/test_common_advertising_page.py"
      - ".github/workflows/remask-owner-page-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  owner-page-access:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python_backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: python_backend/requirements.txt
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile provisioning code
        run: python -m compileall -q app
      - name: Run owner Page access tests
        run: python -m unittest -v tests.test_common_advertising_page
