name: ReMask Docker Diagnostic

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build ReMask image
        run: docker build --progress=plain -t remask-diagnostic .
      - name: Build Python worker preview image
        run: docker build --progress=plain -f python_backend/Dockerfile -t remask-python-preview python_backend
      - name: Scan runtime image for fixable high and critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: remask-diagnostic
          format: json
          output: remask-image-vulnerabilities.json
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - name: Preserve image package inventory and vulnerability scan
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: remask-security-scan
          path: remask-image-vulnerabilities.json
      - name: Start container
        run: |
          mkdir -p /tmp/remask-ci-state
          printf '%s\n' '[{"name":"fixture","cookies":[]}]' > /tmp/remask-ci-state/accounts.json
          docker run -d --name remask-diagnostic-run -p 18080:80 \
            -v /tmp/remask-ci-state:/var/lib/remask \
            -e REMASK_PASSWORD=ci-fixture-only \
            -e REMASK_CREDENTIALS_KEY=6666666666666666666666666666666666666666666666666666666666666666 \
            -e PORT=80 -e REMASK_E2E_SMOKE_ON_START=0 remask-diagnostic
      - name: Verify runtime health
        run: |
          set -e
          ok=0
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:18080/ready.php >/tmp/remask-health.json; then
              ok=1
              break
            fi
            sleep 1
          done
          cat /tmp/remask-health.json 2>/dev/null || true
          curl -fsS http://127.0.0.1:18080/health
          if [ "$ok" != "1" ]; then
            docker logs --tail 250 remask-diagnostic-run || true
            exit 1
          fi
      - name: Private bundle files stay behind the authenticated endpoint
        run: |
          set -e
          for path in bundles.json bundles.json.bak BUNDLES.JSON accounts.json; do
            status=$(curl -sS -o /dev/null -w '%{http_code}' "http://127.0.0.1:18080/$path")
            test "$status" = 403 || { echo "Unexpected public file status for $path: $status"; exit 1; }
          done
          status=$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/ajax/metaBundles.php)
          test "$status" = 401
      - name: Assert HTTP-only runtime and encrypted profiles
        run: |
          docker logs remask-diagnostic-run 2>&1 | grep -F '[profile-storage] ready count=1 encrypted=1 key_encoding=hex'
          docker exec remask-diagnostic-run sh -c '! command -v chromium && ! command -v chromium-browser'
          docker exec remask-diagnostic-run /opt/remask-venv/bin/python -c "import importlib.util; assert importlib.util.find_spec('playwright') is None"
          docker exec remask-diagnostic-run php -r 'require "/var/www/html/settings.php";require "/var/www/html/classes/AccountStoreFactory.php"; $store=AccountStoreFactory::create(ACCOUNTSFILENAME); assert(is_array($store->deserialize()));'
      - name: Private worker state remains readable by the PHP account
        run: |
          docker exec -u www-data remask-diagnostic-run php -r '$p="/var/lib/remask/workspace-created-businesses.json";if(!is_readable($p)||!is_array(json_decode(file_get_contents($p),true)))exit(1);if((fileperms($p)&0777)!==0600)exit(2);'
          docker exec -i remask-diagnostic-run /opt/remask-venv/bin/python - <<'PY'
          import os, pathlib, pwd
          uid=pwd.getpwnam('www-data').pw_uid
          workers=[]
          for process in pathlib.Path('/proc').glob('[0-9]*'):
              try:
                  command=(process/'cmdline').read_bytes().split(b'\0')
                  if len(command)<2 or not command[0].rsplit(b'/',1)[-1].startswith(b'python') or not command[1].endswith(b'/uvicorn'):
                      continue
                  ids=next(line.split()[1:] for line in (process/'status').read_text().splitlines() if line.startswith('Uid:'))
                  workers.append([int(value) for value in ids])
              except (FileNotFoundError,ProcessLookupError):
                  continue
          assert len(workers)==1 and all(value==uid for value in workers[0]),workers
          print('Embedded worker and PHP use the same private volume identity; mirror mode remains 0600.')
          PY
      - name: Container logs
        if: always()
        run: docker logs --tail 120 remask-diagnostic-run || true
