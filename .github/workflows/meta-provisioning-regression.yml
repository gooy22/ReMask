name: Meta provisioning regressions
on:
  push:
    branches: [main, fix/private-launch-catalog, fix/ads-received-response-diagnostics, 'fix/fan-page-*']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: meta-regression-${{ github.ref }}
  cancel-in-progress: true
jobs:
  launch_http:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      REMASK_DATA_DIR: /tmp/remask-launch-http-state
      REMASK_DOC_ID_STORE: /tmp/remask-launch-http-state/facebook-web/docids.json
    steps:
      - uses: actions/checkout@v4
      - name: Verify preinstalled PHP CLI
        run: php --version
      - name: Install backend dependencies without browser tooling
        run: |
          python3 -m venv /tmp/remask-launch-http
          /tmp/remask-launch-http/bin/pip install -r python_backend/requirements.txt
          php --version
          /tmp/remask-launch-http/bin/python -c "import importlib.util; assert importlib.util.find_spec('playwright') is None"
      - name: Launch serializer, draft lifecycle, recovery, media and PHP bridge fixtures
        working-directory: python_backend
        run: /tmp/remask-launch-http/bin/python -m unittest tests.test_private_ads_launch tests.test_private_ads_draft tests.test_private_ads_inspect tests.test_private_ads_objective_repair tests.test_private_ads_objectives tests.test_private_ads_bidding tests.test_private_ads_objective_wire tests.test_private_ads_exact_settings tests.test_private_ads_http tests.test_private_launch_http tests.test_media_preflight.MediaBridgeErrorTests tests.test_media_preflight.NativeMediaPreflightTests tests.test_media_preflight.MediaInspectionEndpointTests tests.test_private_launch_bridge

  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      REMASK_DATA_DIR: /tmp/remask-regression-state
      REMASK_DOC_ID_STORE: /tmp/remask-regression-state/facebook-web/docids.json
    steps:
      - uses: actions/checkout@v4
      - name: Ensure media inspection tools
        run: |
          if command -v ffmpeg >/dev/null 2>&1 && command -v ffprobe >/dev/null 2>&1; then
            ffmpeg -version | head -n 1
            ffprobe -version | head -n 1
          else
            bash .github/scripts/ubuntu-ci-mirrors.sh
            sudo timeout --kill-after=10s 90s apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update
            sudo timeout --kill-after=10s 180s apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 install -y --no-install-recommends ffmpeg
            ffmpeg -version | head -n 1
            ffprobe -version | head -n 1
          fi
      - name: Install backend dependencies
        run: |
          python3 -m venv /tmp/remask-regression
          /tmp/remask-regression/bin/pip install -r python_backend/requirements.txt
          node --version
          php --version
      - name: Critical capture and authentication contracts
        working-directory: python_backend
        run: /tmp/remask-regression/bin/python -m unittest tests.test_business_browser_flow.BrowserAdAccountFormActionTests tests.test_business_browser_flow.BrowserAdAccountFinalCaptureGateRegressionTests tests.test_business_browser_flow.BrowserAdAccountFinalDialogAnchorRegressionTests tests.test_business_browser_flow.BrowserAdAccountFinalLabelMatchingTests tests.test_business_browser_flow.BrowserAdAccountSubmitScopeRegressionTests tests.test_fb_worker_request_envelope.BusinessAuthenticationPrecheckTests tests.test_business_resume_checkpoint.BusinessResumeCheckpointTests.test_auth_rejection_does_not_leave_ambiguous_create_checkpoint tests.test_graphql_mutation_capture
      - name: Direct HTTP FP/RK contracts and inventory proofs
        working-directory: python_backend
        run: /tmp/remask-regression/bin/python -m unittest tests.test_ad_account_private_contract tests.test_fan_page_private_contract tests.test_private_inventory tests.test_private_inventory_queries tests.test_private_http tests.test_private_create_handlers tests.test_private_business_preflight tests.test_private_page_ownership tests.test_static_meta_contracts
      - name: Private Launch installed module fixture
        working-directory: python_backend
        run: /tmp/remask-regression/bin/python -m unittest tests.test_private_launch_catalog.PrivateLaunchCatalogTests.test_installer_and_generated_php_lint_and_js_cache_bust
      - name: Backend regression suite
        working-directory: python_backend
        run: |
          /tmp/remask-regression/bin/python - <<'PY'
          import unittest
          suite = unittest.defaultTestLoader.discover("tests")
          result = unittest.TextTestRunner(verbosity=1).run(suite)
          unexpected = [(test, reason) for test, reason in result.skipped
                        if reason not in {"No local Chromium installed", "No Chromium installed",
                                         "Development renderer fixture unavailable (Playwright not installed)"}]
          if unexpected:
              print("Unexpected skipped regression cases:", unexpected)
          raise SystemExit(0 if result.wasSuccessful() and not unexpected else 1)
          PY
      - name: Audit exact backend dependency lock
        run: |
          /tmp/remask-regression/bin/pip install pip-audit==2.10.1
          /tmp/remask-regression/bin/pip-audit -r python_backend/requirements.lock --no-deps --disable-pip
      - name: Selected Business sync scope
        run: node tests/workspace-sync-scope.test.cjs
      - name: Automatic batch interface
        run: node tests/worker-auto-ui.test.cjs
      - name: Private Launch catalog and funding interface
        run: |
          node tests/launch-private-catalog.test.cjs
          node tests/launch-batch-review.test.cjs
      - name: Installed Launch UI to PHP targeting bridge
        run: node tests/launch-ui-php-targeting-bridge.test.cjs
      - name: Installed Launch fields match native Ads serializer
        run: node tests/launch-native-field-availability.test.cjs
      - name: Bundle media snapshots and delayed restore guards
        run: node --test tests/bundle-media-runtime.test.cjs
      - name: Cookie-only profile interface
        run: node tests/cookie-profile-ui.test.cjs
      - name: Private payment inspection interface
        run: node tests/payment-inspection-ui.test.cjs

      - name: Authenticated targeting choices and stale response guards
        run: |
          node tests/targeting-picker-runtime.test.cjs
          node tests/creative-targeting-roundtrip.test.cjs

      - name: Advertising estimate retry and account selection guards
        run: node tests/advertising-estimate-retry.test.cjs

      - name: TXT account import interface
        run: node tests/cookie-txt-import-ui.test.cjs

  payment_guards:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Install runtime build test dependencies
        run: |
          python3 -m venv /tmp/remask-runtime-build
          /tmp/remask-runtime-build/bin/pip install -r python_backend/requirements.txt
      - name: Complete PHP runtime overlay build
        run: PYTHONPATH=python_backend /tmp/remask-runtime-build/bin/python -m unittest tests.test_cookie_only_profiles.CookieOnlyProfileTests.test_complete_runtime_overlay_order_and_installed_php_build_contracts
      - name: Card UI installation and browser cache invalidation
        run: php tests/payment-inspection-install.test.php

      - name: Confirmed RK identity does not promote live advertising readiness
        run: php tests/private-inventory-identity.test.php

      - name: Universal template targeting lookup scope
        run: php tests/template-targeting-context.test.php

      - name: Worker and persistent storage readiness
        run: php tests/readiness.test.php

      - name: Exact UI to PHP advertising budget values
        run: php tests/meta-official-budget-bridge.test.php
      - name: Private advertising template helper scope
        run: php tests/advertising-helper.test.php

      - name: Encrypted card storage and submission guard
        run: php tests/payment-card-vault.test.php

      - name: Honest Meta sync outcomes
        run: php tests/sync-outcome.test.php

  browser_regression:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Install Chromium fixture dependencies
        run: |
          bash .github/scripts/ubuntu-ci-mirrors.sh
          python3 -m venv /tmp/remask-browser-regression
          /tmp/remask-browser-regression/bin/pip install -r python_backend/requirements.txt
          /tmp/remask-browser-regression/bin/pip install -r python_backend/requirements-browser-tests.txt
          /tmp/remask-browser-regression/bin/python -m playwright install --with-deps chromium
      - name: Dispatched click timeout retains the original mutation intent
        working-directory: python_backend
        run: |
          /tmp/remask-browser-regression/bin/python - <<'PY'
          import unittest
          suite = unittest.defaultTestLoader.loadTestsFromName("tests.test_ad_account_details_recovery.AdAccountDetailsChromiumTests.test_dispatched_click_timeout_is_observed_without_second_final_click")
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          raise SystemExit(0 if result.wasSuccessful() and not result.skipped else 1)
          PY
      - name: Reproduce original stacked-dialog failure
        run: |
          git fetch --depth=1 origin 554fff1cfac8913e815821c2601842ca8744dfdf
          git worktree add --detach /tmp/remask-before 554fff1cfac8913e815821c2601842ca8744dfdf
          if PYTHONPATH=/tmp/remask-before/python_backend /tmp/remask-browser-regression/bin/python tests/meta-ad-account-dialogs.browser.py StackedDialogsTests.test_next_uses_foreground_details_dialog; then
            echo "Expected the original foreground-dialog reproduction to fail"
            exit 1
          fi
      - name: Verify Details to Confirm capture and duplicate guards in Chromium
        run: PYTHONPATH=python_backend /tmp/remask-browser-regression/bin/python tests/meta-ad-account-dialogs.browser.py
